<div class="cordas" role="group" aria-label="Corda a afinar">
  <!-- O automático é a primeira escolha da fileira, e não um interruptor à
       parte: ele e as cordas respondem à mesma pergunta — quem o afinador
       deve mirar agora. -->
  <button
    type="button"
    class="auto"
    [class.auto--ligado]="automatico()"
    [attr.aria-pressed]="automatico()"
    aria-label="Automático: o afinador acha a corda sozinho."
    (click)="voltarParaAutomatico.emit()"
  >
    <span class="auto__brilho" aria-hidden="true">✨</span>
    <span class="auto__nome">Auto</span>
  </button>

  @for (corda of cordas(); track corda.id) {
    <button
      type="button"
      class="corda"
      [class.corda--alvo]="corda.alvo"
      [class.corda--concluida]="corda.concluida"
      [attr.aria-pressed]="!automatico() && corda.alvo"
      [attr.aria-label]="
        corda.numero + 'ª corda, ' + corda.nome + ' ' + corda.oitava + '. Afinar esta corda.'
      "
      (click)="escolher.emit(corda.id)"
    >
      <span class="corda__cifra">
        {{ corda.cifra }}<span class="corda__oitava">{{ corda.oitava }}</span>
      </span>
      <span class="corda__nome">{{ corda.nome }}</span>
      @if (corda.concluida) {
        <span class="corda__selo" aria-hidden="true">✓</span>
      }
    </button>
  }
</div>
