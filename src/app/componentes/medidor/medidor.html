<div class="medidor__flor">
  <svg viewBox="-150 -150 300 300" role="img" [attr.aria-label]="rotuloAcessivel()">
    <path #miolo class="medidor__miolo" [attr.d]="florParada"></path>
    <path #anel class="medidor__anel" [attr.d]="anelParado"></path>
  </svg>
  <div class="medidor__centro">
    <ng-content select="[nota]" />
  </div>
</div>

<div class="medidor__leitura">
  <ng-content select="[leitura]" />
</div>

<div class="medidor__fita">
  <svg viewBox="0 0 320 44" preserveAspectRatio="none" aria-hidden="true">
    <path class="medidor__trilho" d="M6 22 H314"></path>
    <path #onda class="medidor__onda" [attr.d]="ondaParada"></path>
    <rect #marcador class="medidor__marcador" x="157" y="4" width="6" height="36" rx="3"></rect>
  </svg>
</div>

<div class="medidor__escala" aria-hidden="true"><span>−50</span><span>0</span><span>+50</span></div>
